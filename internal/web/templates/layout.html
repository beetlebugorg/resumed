<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} · resumed</title>
  <script>
    // Runs before the stylesheet to avoid a flash of the wrong scheme.
    (function () {
      try {
        var t = localStorage.getItem('resumed-theme');
        if (t === 'day' || t === 'night') document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">resumed</a>
    <nav>
      <a href="/" {{if eq .Nav "jobs"}}class="active"{{end}}>Jobs</a>
      <a href="/questions" {{if eq .Nav "questions"}}class="active"{{end}}>
        Questions{{if .OpenCount}} <span class="badge">{{.OpenCount}}</span>{{end}}
      </a>
      <a href="/facts" {{if eq .Nav "facts"}}class="active"{{end}}>Facts</a>
    </nav>

    {{/* Day, night, or follow the system. CSS holds the label so it is right
         on the first frame. The script advances the setting. */}}
    <button type="button" id="theme-toggle" class="theme-toggle"
            title="Chart scheme: day, night, or follow the system"></button>
  </header>

  <!-- Server-sent messages land here via the HX-Trigger "flash" event. -->
  <div id="flash-host" aria-live="polite">
    {{with .Flash}}<div class="flash">{{.}}</div>{{end}}
  </div>

  <main{{if .Wide}} class="full"{{end}}>
    {{block "content" .}}{{end}}
  </main>

  <script>
    // Day, then night, then back to following the system. The third state
    // stores no preference, so a machine that changes its own appearance is
    // followed again.
    (function () {
      var btn = document.getElementById('theme-toggle');
      var root = document.documentElement;
      var order = ['day', 'night', ''];

      function label() {
        var t = root.dataset.theme;
        btn.setAttribute('aria-label',
          'Chart scheme: ' + (t === 'day' ? 'day' : t === 'night' ? 'night' : 'following the system')
          + '. Click to change.');
      }

      btn.addEventListener('click', function () {
        var next = order[(order.indexOf(root.dataset.theme || '') + 1) % order.length];
        if (next) {
          root.dataset.theme = next;
        } else {
          delete root.dataset.theme;
        }
        try {
          if (next) localStorage.setItem('resumed-theme', next);
          else localStorage.removeItem('resumed-theme');
        } catch (e) {}
        label();
      });

      label();
    })();

    // A single listener turns any HX-Trigger {"flash": "..."} into a banner.
    document.body.addEventListener('flash', function (e) {
      const host = document.getElementById('flash-host');
      const msg = (e.detail && (e.detail.value || e.detail)) || '';
      if (!msg) return;
      host.innerHTML = '<div class="flash"></div>';
      host.firstChild.textContent = msg;
    });
  </script>
</body>
</html>
